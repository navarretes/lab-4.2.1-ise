{% extends "main.html" %}

{% block page_name %}
{{ page_name }}
{% endblock %}

{% block breadcrumb %}
<li><a href="{{ url_for('all_pages') }}">Pages</a></li>
<li class="is-active"><a href="#" aria-current="page">{{ page_name }}</a></li>
{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h1 class="title is-2">{{ page_name }}</h1>
    </div>
    <div class="card-content">
        <div class="content">
            {{ page_content }}
        </div>
    </div>
</div>
{% endblock %}
